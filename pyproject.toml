[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-booking"
version = "0.1.0"
description = "Cálculo del costo de estadías de hotel"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["booking"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
